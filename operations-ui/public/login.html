<!doctype html>
<html lang="en" class="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in | M365 Operations Intelligence</title>
  <link rel="stylesheet" href="/styles.css">
  <style>
    body { min-height:100vh; display:grid; place-items:center; padding:24px; }
    .auth-card { width:min(100%, 430px); background:var(--bg-card); border:1px solid var(--border-strong); border-radius:12px; padding:32px; box-shadow:0 12px 40px rgba(0,0,0,.35); }
    .auth-card h1 { font-size:25px; margin-bottom:8px; }
    .auth-card .subtitle { margin-bottom:28px; }
    .auth-card label { display:block; color:var(--text-sec); font-size:12px; font-weight:700; margin:16px 0 6px; }
    .auth-card input { width:100%; padding:11px 12px; border:1px solid var(--border-strong); border-radius:7px; background:var(--bg-page); color:var(--text-pri); font:inherit; }
    .auth-card input:focus { outline:2px solid var(--accent); outline-offset:1px; }
    .auth-button { width:100%; margin-top:22px; border:0; border-radius:7px; padding:11px; background:var(--accent); color:#fff; font-weight:700; cursor:pointer; }
    .auth-button:disabled { opacity:.6; cursor:wait; }
    .auth-error { min-height:20px; margin-top:14px; color:var(--danger-text); font-size:13px; }
    .setup { display:none; }.setup.visible { display:block; }.login.hidden { display:none; }
    #qrcode { display:grid; place-items:center; margin:20px auto; padding:12px; width:max-content; background:#fff; }
    .secret { word-break:break-all; color:var(--text-sec); font-family:ui-monospace,monospace; font-size:12px; }
  </style>
</head>
<body>
  <main class="auth-card">
    <p class="eyebrow">M365 Operations Intelligence</p>
    <h1 id="auth-title">Sign in to your account</h1>
    <section id="login-view" class="login">
      <form id="login-form">
        <label for="email">Email</label><input id="email" type="email" autocomplete="username" required>
        <label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required>
        <label for="totp-code">TOTP code</label><input id="totp-code" style="display:none" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="one-time-code">
        <button class="auth-button" type="submit">Sign in</button>
      </form>
    </section>
    <section id="setup-view" class="setup">
      <p class="subtitle">Set up multi-factor authentication to continue.</p>
      <div id="qrcode" aria-label="TOTP QR code"></div><p class="secret" id="secret"></p>
      <form id="setup-form"><label for="setup-code">Verification code</label><input id="setup-code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" required><button class="auth-button" type="submit">Verify and activate MFA</button></form>
    </section>
    <p id="error" class="auth-error" role="alert"></p>
  </main>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script>
    const $ = (id) => document.getElementById(id);
    const error = (message) => { $("error").textContent = message; };
    const request = async (path, options = {}) => { const response = await fetch(path, { ...options, headers: { "Content-Type": "application/json", Accept: "application/json", ...(options.headers || {}) } }); const data = await response.json().catch(() => ({})); if (!response.ok) throw new Error(data.detail || data.message || "Request failed"); return data; };
    async function setupTotp() { $("login-view").classList.add("hidden"); $("setup-view").classList.add("visible"); $("auth-title").textContent = "Set up multi-factor authentication"; try { const data = await request("/api/auth/totp/setup", { method:"POST", body:JSON.stringify({}) }); const uri = data.qr_code_uri || data.otpauth_uri || data.uri; $("secret").textContent = `Secret: ${data.secret || data.totp_secret || "Unavailable"}`; if (uri && window.QRCode) new QRCode($("qrcode"), { text:uri, width:220, height:220 }); } catch (e) { error(e.message); } }
    $("login-form").addEventListener("submit", async (event) => { event.preventDefault(); error(""); const button = event.target.querySelector("button"); button.disabled = true; try { const data = await request("/api/auth/login", { method:"POST", body:JSON.stringify({ email:$("email").value, password:$("password").value, totp_code:"" }) }); if (data.session_id) sessionStorage.setItem("session_id", data.session_id); window.location.href = "/"; } catch (e) { error(e.message); button.disabled = false; } });
    $("setup-form").addEventListener("submit", async (event) => { event.preventDefault(); error(""); try { const data = await request("/api/auth/totp/verify", { method:"POST", body:JSON.stringify({ code:$("setup-code").value, totp_code:$("setup-code").value }) }); if (data.session_id) sessionStorage.setItem("session_id", data.session_id); window.location.href = "/"; } catch (e) { error(e.message); } });
  </script>
</body>
</html>
