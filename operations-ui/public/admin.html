<!doctype html>
<html lang="en" class="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Super Admin | Operations Intelligence</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script>window.API_KEY = "__API_KEY_PLACEHOLDER__";</script>
  <link rel="stylesheet" href="/styles.css">
  <style>
    .admin-shell{display:grid;grid-template-columns:220px 1fr;gap:18px;max-width:1440px;margin:auto;padding:24px}.admin-sidebar{background:var(--bg-card);border:1px solid var(--border-c);border-radius:10px;padding:18px;height:max-content;position:sticky;top:24px}.admin-sidebar h2{font-size:16px;margin-bottom:20px}.admin-nav{display:grid;gap:6px}.admin-nav button{border:0;background:none;color:var(--text-sec);text-align:left;padding:10px;border-radius:7px;cursor:pointer;font:inherit}.admin-nav button:hover,.admin-nav button.active{background:var(--accent-dim);color:var(--accent-text)}.admin-main{min-width:0}.admin-header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}.admin-section{display:none}.admin-section.active{display:block}.admin-actions{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap}.admin-form{display:flex;gap:8px;flex-wrap:wrap;padding:14px;background:rgba(255,255,255,.04);border:1px solid var(--border-c);border-radius:8px;margin-bottom:14px}.admin-form input,.admin-form select,.inline-editor{background:var(--bg-page);color:var(--text-pri);border:1px solid var(--border-strong);border-radius:6px;padding:8px;font:inherit}.admin-table{overflow-x:auto}.admin-table table{min-width:760px;width:100%;border-collapse:collapse}.admin-table th,.admin-table td{padding:10px;border-top:1px solid var(--border-c);text-align:left;white-space:nowrap}.admin-table th{color:var(--text-sec);font-size:11px;text-transform:uppercase}.admin-table td{font-size:13px}.admin-table button{margin-right:5px}.modal{position:fixed;inset:0;background:rgba(0,0,0,.7);display:grid;place-items:center;padding:20px}.modal-card{background:var(--bg-card);border:1px solid var(--border-strong);border-radius:10px;padding:24px;max-width:420px;width:100%}.modal-card code{display:block;padding:12px;margin:14px 0;background:var(--bg-page);word-break:break-all}.notice{color:var(--warning-text);margin-bottom:12px}@media(max-width:760px){.admin-shell{grid-template-columns:1fr;padding:14px}.admin-sidebar{position:static}.admin-nav{grid-template-columns:repeat(2,1fr)}}
  </style>
</head>
<body>
  <div class="admin-shell">
    <aside class="admin-sidebar"><h2>Super Admin</h2><nav class="admin-nav"><a class="plain-button" href="/"><i class="ti ti-arrow-left"></i> Back to Dashboard</a><button data-page="dashboard">Dashboard</button><button data-page="tenants">Tenants</button><button data-page="users">Users</button><button data-page="flags">Feature Flags</button><button data-page="settings">System Settings</button><button data-page="collectors">Collector Status</button></nav></aside>
    <main class="admin-main">
      <header class="topbar admin-header"><div><p class="eyebrow">Administration</p><h1 id="page-title">Dashboard</h1></div><div><span id="user-email" class="subtitle"></span> <button id="logout" class="plain-button" type="button">Logout</button></div></header>
      <div id="message" class="notice"></div>
      <section class="admin-section active" data-section="dashboard"><div class="panel"><h2>Administration dashboard</h2><p class="subtitle">Manage tenants, users, feature flags, system settings, and collectors.</p></div></section>
      <section class="admin-section" data-section="tenants"><div class="admin-actions"><h2>Tenants</h2><button class="plain-button" data-add="tenant">Add Tenant</button></div><form id="tenant-form" class="admin-form hidden"><input name="display_label" placeholder="Display label" required><input name="entra_tenant_id" placeholder="Entra tenant ID" required><button class="plain-button">Create</button></form><div id="tenant-table" class="panel admin-table"></div></section>
      <section class="admin-section" data-section="users"><div class="admin-actions"><h2>Users</h2><button class="plain-button" data-add="user">Add User</button></div><form id="user-form" class="admin-form hidden"><input name="email" type="email" placeholder="Email" required><input name="password" type="password" placeholder="Password" required><select name="role"><option>SUPER_ADMIN</option><option>TENANT_ADMIN</option><option>TENANT_USER</option></select><input name="tenant_id" type="number" placeholder="Tenant ID"><button class="plain-button">Create</button></form><div id="user-table" class="panel admin-table"></div></section>
      <section class="admin-section" data-section="flags"><h2>Feature Flags</h2><div id="flag-table" class="panel admin-table"></div></section>
      <section class="admin-section" data-section="settings"><h2>System Settings</h2><div id="setting-table" class="panel admin-table"></div></section>
      <section class="admin-section" data-section="collectors"><h2>Collector Status</h2><div id="collector-table" class="panel admin-table"></div></section>
    </main>
  </div>
  <div id="modal" class="modal hidden"><div class="modal-card"><h2>New generated password</h2><code id="password-value"></code><button id="close-modal" class="plain-button" type="button">Close</button></div></div>
<script>
const sid=sessionStorage.getItem('session_id');if(!sid)location.href='/login.html';const $=s=>document.querySelector(s), esc=v=>String(v??'-').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
const headers=(json=false)=>({'Accept':'application/json','X-API-Key':window.API_KEY||'','X-Session-ID':sid,...(json?{'Content-Type':'application/json'}:{})});
async function api(path,opts={}){const r=await fetch(path,{...opts,headers:{...headers(Boolean(opts.body)),...(opts.headers||{})}});if(!r.ok)throw Error('Request failed');return r.json()}
function table(cols,rows){return '<table><thead><tr>'+cols.map(x=>'<th>'+esc(x)+'</th>').join('')+'</tr></thead><tbody>'+(Array.isArray(rows)?rows.join(''):rows)+'</tbody></table>'}
async function loadTenants(){const d=await api('/api/admin/tenants');console.log('tenants response:',d);const rows=d.tenants||[];$('#tenant-table').innerHTML=table(['ID','Label','Entra tenant ID','Enabled','Created','Actions'],rows.map(t=>`<tr><td>${esc(t.tenant_id)}</td><td>${esc(t.display_label)}</td><td>${esc(t.entra_tenant_id)}</td><td>${t.enabled?'Yes':'No'}</td><td>${esc(t.created_at)}</td><td><button class="plain-button" data-toggle-tenant="${t.tenant_id}" data-enabled="${t.enabled}">${t.enabled?'Disable':'Enable'}</button><button class="plain-button" data-features="${t.tenant_id}">Manage Features</button></td></tr>`).join('')||'<tr><td colspan="6">No tenants</td></tr>')}
async function loadUsers(){const d=await api('/api/admin/users');const rows=d.users||[];$('#user-table').innerHTML=table(['ID','Email','Role','Tenant','Active','TOTP','Last login','Actions'],rows.map(u=>`<tr><td>${esc(u.user_id)}</td><td>${esc(u.email)}</td><td>${esc(u.role)}</td><td>${esc(u.tenant_id)}</td><td>${u.is_active?'Yes':'No'}</td><td>${u.totp_enrolled?'Yes':'No'}</td><td>${esc(u.last_login_at)}</td><td><button class="plain-button" data-toggle-user="${u.user_id}" data-active="${u.is_active}">${u.is_active?'Disable':'Enable'}</button><button class="plain-button" data-reset="${u.user_id}">Reset Password</button></td></tr>`).join('')||'<tr><td colspan="8">No users</td></tr>')}
async function loadFlags(){const d=await api('/api/admin/feature-flags');$('#flag-table').innerHTML=table(['Flag','Description','Global','Tenant overrides'],(d.feature_flags||[]).map(f=>`<tr><td>${esc(f.flag_name)}</td><td>${esc(f.description)}</td><td><button class="plain-button" data-flag="${esc(f.flag_name)}" data-enabled="${f.is_enabled}">${f.is_enabled?'Enabled':'Disabled'}</button></td><td>${(f.tenant_overrides||[]).map(x=>esc(x.tenant_id)+': '+(x.is_enabled?'on':'off')).join(', ')||'-'}</td></tr>`).join(''))}
async function loadSettings(){const d=await api('/api/admin/settings');$('#setting-table').innerHTML=table(['Key','Value','Type','Description','Action'],(d.settings||[]).map(s=>`<tr><td>${esc(s.setting_key)}</td><td><input class="inline-editor" data-setting-value="${esc(s.setting_key)}" value="${esc(s.setting_value)}"></td><td>${esc(s.setting_type)}</td><td>${esc(s.description)}</td><td><button class="plain-button" data-save-setting="${esc(s.setting_key)}">Save</button></td></tr>`).join(''))}
async function loadCollectors(){const d=await api('/api/admin/collector/status');$('#collector-table').innerHTML=table(['Collector','Tenant','Last run','Updated','Status'],(d.collector_status||[]).map(x=>`<tr><td>${esc(x.collector_id)}</td><td>${esc(x.tenant_id)}</td><td>${esc(x.checkpoint_at)}</td><td>${esc(x.updated_at)}</td><td>${x.checkpoint_at?'Ready':'Unknown'}</td></tr>`).join(''))}
const loaders={tenants:loadTenants,users:loadUsers,flags:loadFlags,settings:loadSettings,collectors:loadCollectors};
async function show(page){document.querySelectorAll('[data-section]').forEach(x=>x.classList.toggle('active',x.dataset.section===page));document.querySelectorAll('[data-page]').forEach(x=>x.classList.toggle('active',x.dataset.page===page));$('#page-title').textContent=page==='flags'?'Feature Flags':page==='collectors'?'Collector Status':page==='settings'?'System Settings':page[0].toUpperCase()+page.slice(1);if(loaders[page])try{await loaders[page]()}catch(e){$('#message').textContent='Unable to load '+page+'.'}}

document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>show(b.dataset.page));document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>$('#'+b.dataset.add+'-form').classList.toggle('hidden'));
$('#tenant-form').onsubmit=async e=>{e.preventDefault();await api('/api/admin/tenants',{method:'POST',body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});e.target.reset();e.target.classList.add('hidden');loadTenants()};$('#user-form').onsubmit=async e=>{e.preventDefault();const v=Object.fromEntries(new FormData(e.target));v.tenant_id=v.tenant_id?Number(v.tenant_id):null;await api('/api/admin/users',{method:'POST',body:JSON.stringify(v)});e.target.reset();e.target.classList.add('hidden');loadUsers()};
document.addEventListener('click',async e=>{const b=e.target;if(b.dataset.toggleTenant)await api('/api/admin/tenants/'+b.dataset.toggleTenant,{method:'PATCH',body:JSON.stringify({enabled:b.dataset.enabled!=='true'})}),loadTenants();if(b.dataset.toggleUser)await api('/api/admin/users/'+b.dataset.toggleUser,{method:'PATCH',body:JSON.stringify({is_active:b.dataset.active!=='true'})}),loadUsers();if(b.dataset.reset){const d=await api('/api/admin/users/'+b.dataset.reset+'/reset-password',{method:'POST'});$('#password-value').textContent=d.new_password;$('#modal').classList.remove('hidden')}if(b.dataset.flag)await api('/api/admin/feature-flags/'+b.dataset.flag,{method:'PATCH',body:JSON.stringify({is_enabled:b.dataset.enabled!=='true'})}),loadFlags();if(b.dataset.saveSetting){const input=document.querySelector(`[data-setting-value="${CSS.escape(b.dataset.saveSetting)}"]`);await api('/api/admin/settings/'+b.dataset.saveSetting,{method:'PATCH',body:JSON.stringify({setting_value:input.value})}),loadSettings()}});$('#close-modal').onclick=()=>$('#modal').classList.add('hidden');$('#logout').onclick=async()=>{try{await api('/api/auth/logout',{method:'POST'})}catch(_){}sessionStorage.removeItem('session_id');location.href='/login.html';}
(async()=>{try{const d=await api('/api/auth/me');if(d.user?.role!=='SUPER_ADMIN')throw Error();$('#user-email').textContent=d.user.email;show('dashboard')}catch(_){location.href='/login.html'}})();
</script></body></html>
