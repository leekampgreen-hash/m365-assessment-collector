server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location = /health {
        proxy_pass http://graph-agent-operations-api-dev:8080/health;
        proxy_set_header Host $host;
    }

    location /api/operations/ {
        proxy_pass http://graph-agent-operations-api-dev:8080;
        proxy_set_header Host $host;
    }

    location /api/security/ {
        proxy_pass http://graph-agent-operations-api-dev:8080;
        proxy_set_header Host $host;
    }

    location = /index.html {
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    location ~* \.(?:js|css)$ {
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
