server {
    listen 80;
    sub_filter '__API_KEY_PLACEHOLDER__' '${API_KEY}';
    sub_filter_once on;
    sub_filter_types text/html;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location = /health {
        proxy_pass http://graph-agent-operations-api-dev:8080/health;
        proxy_set_header Host $host;
        proxy_set_header X-API-Key $http_x_api_key;
    }

    location /api/operations/ {
        proxy_pass http://operations-api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-API-Key $http_x_api_key;
        proxy_set_header X-Session-ID $http_x_session_id;
        proxy_set_header X-Tenant-ID $http_x_tenant_id;
    }

    location /api/security/ {
        proxy_pass http://operations-api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-API-Key $http_x_api_key;
        proxy_set_header X-Session-ID $http_x_session_id;
        proxy_set_header X-Tenant-ID $http_x_tenant_id;
    }

    location /api/entra/ {
        proxy_pass http://operations-api:8080;
        proxy_set_header X-API-Key $http_x_api_key;
        proxy_set_header X-Session-ID $http_x_session_id;
        proxy_set_header X-Tenant-ID $http_x_tenant_id;
    }

    location /api/intune/ {
        proxy_pass http://operations-api:8080;
        proxy_set_header X-API-Key $http_x_api_key;
        proxy_set_header X-Session-ID $http_x_session_id;
        proxy_set_header X-Tenant-ID $http_x_tenant_id;
    }

    location /api/license/ {
        proxy_pass http://graph-agent-operations-api-dev:8080;
        proxy_set_header Host $host;
        proxy_set_header X-API-Key $http_x_api_key;
    }

    location /api/auth/ {
        proxy_pass http://graph-agent-operations-api-dev:8080;
        proxy_set_header Host $host;
        proxy_set_header X-API-Key $http_x_api_key;
        proxy_set_header X-Session-ID $http_x_session_id;
    }

    location /api/admin/ {
        proxy_pass http://graph-agent-operations-api-dev:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Session-ID $http_x_session_id;
    }

    location = /index.html {
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    location ~* \.(?:js|css)$ {
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/agent/ {
        proxy_pass http://graph-agent-operations-api-dev:8080;
        proxy_set_header Host $host;
        proxy_set_header X-API-Key $http_x_api_key;
    }
}
